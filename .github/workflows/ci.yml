name: CI

on:
  push:
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: uv venv && uv pip install -e ".[dev]"
      - name: Estilo
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
      - name: Tipos
        run: .venv/bin/mypy
      - name: Pruebas
        run: .venv/bin/pytest -q
      - name: Validar perfiles
        run: |
          .venv/bin/electric validar-perfil ../perfiles/cnel-ep
          .venv/bin/electric validar-perfil ../perfiles/control-nfpa70
