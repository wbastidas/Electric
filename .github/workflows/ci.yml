name: CI

on:
  push:
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Estilo
        run: |
          ruff format --check .
          ruff check .
      - name: Tipos
        run: mypy
      - name: Pruebas
        run: pytest -q
      - name: Validar perfiles
        run: |
          electric validar-perfil ../perfiles/cnel-ep
          electric validar-perfil ../perfiles/control-nfpa70
