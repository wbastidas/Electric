[project]
name = "electric"
version = "0.1.0"
description = "Núcleo determinista de la plataforma de proyectos eléctricos CNEL EP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "ezdxf>=1.3,<2",
    "shapely>=2.0,<3",
    "matplotlib>=3.8",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-shapely",
    "types-openpyxl",
]

[project.scripts]
electric = "electric.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["electric"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["electric"]
