id: cnel-ep/niveles-servicio
tipo: niveles_servicio
version: 0.1.0
vigente_desde: 2026-11-01
fuente:
  norma: Regulación ARCONEL-008/24 (distribución y comercialización) y PR-TEC-CTR-002 v5
  numeral: ARCONEL-008/24 sección 8 (punto de entrega y factibilidad), por confirmar
  url: https://www.gob.ec/regulaciones/regulacion-nro-arconel-0082024-distribucion-comercializacion-energia-electrica
estado: por_verificar
nota: >-
  ARCONEL-008/24: hasta 12 kW de demanda declarada se atiende en bajo voltaje;
  sobre 12 kW la distribuidora decide bajo, medio o alto voltaje tras el
  análisis de factibilidad. El manual de acometidas de CNEL indica que CNEL
  provee el transformador hasta 12 kW. Los 500 kW siguen el umbral Tipo II de
  PR-TEC-CTR-002; los 5000 kW de la subestación son una propuesta. Leído de
  resúmenes de búsqueda, no del PDF oficial.
unidades: {demanda_max_kw: kW}
filas:
  - id: red_existente
    nombre: Bajo voltaje desde la red de CNEL (hasta 12 kW)
    demanda_max_kw: 12
    medicion: bt
    descripcion: Bajo voltaje desde la red de CNEL; la distribuidora provee el transformador.
  - id: transformador_propio
    nombre: Punto de entrega según factibilidad de CNEL (más de 12 kW)
    demanda_max_kw: 500
    medicion: bt
    descripcion: >-
      Sobre 12 kW la distribuidora decide tras la factibilidad: desde un
      transformador existente con capacidad o con transformador del cliente.
  - id: cuarto_mt
    nombre: Cuarto de transformación en media tensión
    demanda_max_kw: 5000
    medicion: mt
    descripcion: Medición en 13,8 kV, celdas de media tensión y cuarto de transformación.
  - id: subestacion
    nombre: Subestación propia
    medicion: at
    descripcion: Alimentación en 69 kV o más con subestación del cliente.
